<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - Tradition IA</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
</head>
<body class="auth-body">
  <div class="bg-glow-container">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <div id="app">
    <header class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="images/tradiia_icon.png" alt="Tradition IA Logo" class="brand-logo-img" />
        <span>Tradition<span style="color: var(--primary);">IA</span></span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="translate.html" class="nav-link">Traduction</a>
        <a href="ai-assistant.html" class="nav-link">Assistant IA</a>
        <a href="dictionary.html" class="nav-link">Dictionnaire</a>
        <a href="history.html" class="nav-link">Historique</a>
      </nav>
      <div id="nav-user-container">
        <div class="nav-auth-buttons">
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Passer au Thème Blanc Transparent" aria-label="Passer au Thème Blanc Transparent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content" style="max-width: 560px; margin: 0 auto; width: 100%;">
      <div style="padding: 38px 44px; text-align: center; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(36px) saturate(190%); -webkit-backdrop-filter: blur(36px) saturate(190%); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 28px; box-shadow: 0 35px 90px rgba(0, 0, 0, 0.55);">
        <div style="margin-bottom: 20px; display: flex; justify-content: center; align-items: center;">
          <img src="images/drapeau%20gabon.png" alt="Drapeau du Gabon" style="width: 76px; height: auto; max-height: 48px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 15px rgba(0, 230, 118, 0.3)); display: block;">
        </div>
        <h1 style="font-size: 1.6rem; margin-bottom: 6px;">Mot de passe oublié</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 22px;">Saisissez votre email pour recevoir un lien de réinitialisation</p>

        <form id="form-forgot" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
          <div class="form-group">
            <label class="form-label" style="font-size: 0.85rem; margin-bottom: 4px;">Adresse Email</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="ex: votre.email@mail.ga" required style="background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); padding: 10px 14px; border-radius: 10px;">
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px; font-size: 0.95rem; margin-top: 4px;">
            Envoyer le lien de secours ➔
          </button>
        </form>

        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.85rem; color: var(--text-muted);">
          Retour à la <a href="login.html" style="color: var(--primary); font-weight: 600;">Page de Connexion</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('form-forgot')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;
        window.showToast(`Un email de réinitialisation a été envoyé à ${email}`);
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      });
    });
  </script>
</body>
</html>
