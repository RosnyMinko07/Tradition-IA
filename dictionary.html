<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionnaire - Tradition IA</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdf_knowledge.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div class="bg-glow-container">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <div id="app">
    <header class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="images/tradiia_icon.png" alt="Tradition IA Logo" class="brand-logo-img" />
        <span>Tradition<span style="color: var(--primary);">IA</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="translate.html" class="nav-link">Traduction</a>
        <a href="ai-assistant.html" class="nav-link">Assistant IA</a>
        <a href="dictionary.html" class="nav-link active">Dictionnaire</a>
        <a href="history.html" class="nav-link">Historique</a>
        <a href="profile.html" class="nav-link">Mon Profil</a>
      </nav>

      <div id="nav-user-container">
        <div class="nav-auth-buttons">
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Passer au Thème Blanc Transparent" aria-label="Passer au Thème Blanc Transparent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a href="login.html" class="btn btn-secondary" style="padding: 8px 16px;">Connexion</a>
          <a href="register.html" class="btn btn-primary" style="padding: 8px 16px;">S'inscrire</a>
        </div>
      </div>
    </header>

    <div class="layout-container">
      <main class="main-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Dictionnaire Collaboratif</h1>
            <p class="page-subtitle">Recherchez et explorez les mots répertoriés des langues locales</p>
          </div>
          <button id="btn-add-word-modal" class="btn btn-primary">+ Proposer un mot</button>
        </div>

        <div class="glass-card" style="padding: 20px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 240px;">
            <input type="text" id="dict-search-input" class="form-input" placeholder="🔍 Rechercher un mot en Français ou traduction...">
          </div>
          <div style="width: 200px;">
            <select id="dict-filter-lang" class="form-select">
              <option value="">Toutes les langues</option>
            </select>
          </div>
        </div>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Mot (Français)</th>
                <th>Traduction Locale</th>
                <th>Langue</th>
                <th>Catégorie</th>
                <th>Exemple</th>
              </tr>
            </thead>
            <tbody id="dictionary-table-body">
              <!-- Chargé par JS -->
            </tbody>
          </table>
        </div>

        <!-- Modale Proposer un Mot -->
        <div id="modal-add-word" class="modal-backdrop">
          <div class="modal-card">
            <div class="modal-header">
              <h3 style="font-size: 1.2rem;">📖 Proposer un Nouveau Mot</h3>
              <button class="btn btn-secondary btn-icon" data-close-modal>✕</button>
            </div>
            <form id="form-add-word">
              <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                  <label class="form-label">Mot en Français</label>
                  <input type="text" id="new-word-fr" class="form-input" placeholder="ex: Maison" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Traduction Locale</label>
                  <input type="text" id="new-word-gabo" class="form-input" placeholder="ex: Ntang" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Langue Cible</label>
                  <select id="new-word-lang" class="form-select">
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Catégorie</label>
                  <select id="new-word-cat" class="form-select">
                    <option value="Salutations">Salutations</option>
                    <option value="Expressions">Expressions</option>
                    <option value="Nourriture">Nourriture</option>
                    <option value="Personnes">Personnes</option>
                    <option value="Lieux">Lieux</option>
                    <option value="Nature">Nature</option>
                    <option value="Général">Général</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Exemple de Phrase</label>
                  <input type="text" id="new-word-example" class="form-input" placeholder="ex: Mon ntang est au village">
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer le Mot</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.Store) {
        await window.Store.loadInitialData();

        const langFilter = document.getElementById('dict-filter-lang');
        const langNew = document.getElementById('new-word-lang');
        if (window.Store.languages) {
          const opts = window.Store.languages.map(l => `<option value="${l.name}">${l.name}</option>`).join('');
          if (langFilter) langFilter.innerHTML = '<option value="">Toutes les langues</option>' + opts;
          if (langNew) langNew.innerHTML = opts;
        }

        renderDict();

        document.getElementById('dict-search-input')?.addEventListener('input', renderDict);
        document.getElementById('dict-filter-lang')?.addEventListener('change', renderDict);

        document.getElementById('btn-add-word-modal')?.addEventListener('click', () => {
          document.getElementById('modal-add-word')?.classList.add('active');
        });

        document.getElementById('form-add-word')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const entry = {
            word: document.getElementById('new-word-fr').value,
            translation: document.getElementById('new-word-gabo').value,
            targetLang: document.getElementById('new-word-lang').value,
            sourceLang: 'Français',
            category: document.getElementById('new-word-cat').value || 'Général',
            example: document.getElementById('new-word-example').value
          };
          await window.Store.addDictionaryEntry(entry);
          document.getElementById('modal-add-word')?.classList.remove('active');
          window.showToast('Mot ajouté au dictionnaire avec succès !');
          renderDict();
        });
      }
    });

    function renderDict() {
      const container = document.getElementById('dictionary-table-body');
      if (!container || !window.Store) return;

      const q = (document.getElementById('dict-search-input')?.value || '').toLowerCase();
      const lang = document.getElementById('dict-filter-lang')?.value;

      const filtered = window.Store.dictionary.filter(i => {
        const matchQ = i.word.toLowerCase().includes(q) || i.translation.toLowerCase().includes(q);
        const matchL = !lang || i.targetLang === lang;
        return matchQ && matchL;
      });

      container.innerHTML = filtered.map(item => `
        <tr>
          <td style="font-weight: 700; color: var(--text-main);">${item.word}</td>
          <td style="font-weight: 700; color: var(--primary);">${item.translation}</td>
          <td><span class="badge badge-blue">${item.targetLang}</span></td>
          <td><span class="badge badge-gold">${item.category || 'Général'}</span></td>
          <td style="color: var(--text-muted); font-style: italic;">${item.example || '-'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
