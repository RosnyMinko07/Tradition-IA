<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Langues - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div class="bg-glow-container"><div class="bg-orb bg-orb-1"></div></div>
  <div id="app">
    <header class="navbar">
      <a href="admin.html" class="navbar-brand">
        <img src="images/tradiia_icon.png" alt="Tradition IA Logo" class="brand-logo-img" />
        <span>Tradition<span style="color: var(--primary);">IA</span> <span class="admin-badge">[Admin]</span></span>
      </a>
      <div id="nav-user-container">
        <div class="nav-auth-buttons">
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Passer au Thème Blanc Transparent" aria-label="Passer au Thème Blanc Transparent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="layout-container">
      <aside class="sidebar">
        <div class="sidebar-title">Administration</div>
        <a href="admin.html" class="sidebar-item">📊 Dashboard Admin</a>
        <a href="admin-users.html" class="sidebar-item">👥 Utilisateurs</a>
        <a href="admin-languages.html" class="sidebar-item active">🗣️ Langues Gabonaises</a>
        <a href="admin-dictionary.html" class="sidebar-item">📚 Dictionnaire</a>
        <a href="admin-expressions.html" class="sidebar-item">💬 Expressions</a>
        <a href="admin-ai-validation.html" class="sidebar-item">🤖 Validation IA</a>
        <a href="admin-analytics.html" class="sidebar-item">📈 Analyses & Rapports</a>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Gestion des Langues Gabonaises</h1>
            <p class="page-subtitle">Ajoutez et configurez les langues et leurs attributs régionaux</p>
          </div>
          <button id="btn-open-lang-modal" class="btn btn-primary">+ Ajouter une Langue</button>
        </div>

        <div class="grid-3" id="langs-grid-container">
          <!-- Chargé par JS -->
        </div>

        <!-- Modale Ajouter Langue -->
        <div id="modal-add-lang" class="modal-backdrop">
          <div class="modal-card">
            <div class="modal-header">
              <h3 style="font-size: 1.2rem;">🗣️ Ajouter une Langue Gabonaise</h3>
              <button class="btn btn-secondary btn-icon" data-close-modal>✕</button>
            </div>
            <form id="form-add-lang">
              <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                  <label class="form-label">Nom de la Langue</label>
                  <input type="text" id="new-lang-name" class="form-input" placeholder="ex: Nzébi" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Nom Natif</label>
                  <input type="text" id="new-lang-native" class="form-input" placeholder="ex: Inzébi" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Description / Region</label>
                  <input type="text" id="new-lang-desc" class="form-input" placeholder="ex: Langue du Haut-Ogooué" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Locuteurs Estimés</label>
                  <input type="text" id="new-lang-speakers" class="form-input" placeholder="ex: 60 000" required>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer la Langue</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.Store) {
        await window.Store.loadInitialData();
        renderLangs();

        document.getElementById('btn-open-lang-modal')?.addEventListener('click', () => {
          document.getElementById('modal-add-lang')?.classList.add('active');
        });

        document.getElementById('form-add-lang')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const newLang = {
            name: document.getElementById('new-lang-name').value,
            nativeName: document.getElementById('new-lang-native').value,
            description: document.getElementById('new-lang-desc').value,
            speakers: document.getElementById('new-lang-speakers').value,
            wordCount: 100
          };
          await window.Store.addLanguage(newLang);
          document.getElementById('modal-add-lang')?.classList.remove('active');
          window.showToast('Langue ajoutée !');
          renderLangs();
        });
      }
    });

    function renderLangs() {
      const container = document.getElementById('langs-grid-container');
      if (!container) return;
      const langs = (window.Store && window.Store.languages && window.Store.languages.length)
        ? window.Store.languages
        : (window.MOCK_LANGUAGES || []);
      
      container.innerHTML = langs.map(l => {
        const maskHtml = window.Masks 
          ? window.Masks.render(l.name, 64) 
          : `<div class="mask-img-wrapper" style="width:64px;height:64px;"><img src="images/${(l.name||'fang').toLowerCase()}.png" class="mask-real-img"/></div>`;
        
        return `
        <div class="glass-card" style="padding: 24px; position: relative;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;">
            <div>${maskHtml}</div>
            <button class="btn btn-danger btn-del-l" data-id="${l.id}" style="padding: 4px 8px; font-size: 0.75rem;">✕ Supprimer</button>
          </div>
          <h3 style="font-size: 1.25rem; color: var(--text-main); margin-bottom: 4px;">${l.name}</h3>
          <p style="color: var(--primary); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Nom natif : ${l.nativeName}</p>
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 16px;">${l.description}</p>
          <div style="display: flex; gap: 8px; font-size: 0.8rem;">
            <span class="badge badge-green">${l.wordCount || 500} mots</span>
            <span class="badge badge-gold">${l.speakers || '100K'} locuteurs</span>
          </div>
        </div>
        `;
      }).join('');

      document.querySelectorAll('.btn-del-l').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (confirm('Supprimer cette langue ?')) {
            await window.Store.deleteLanguage(btn.getAttribute('data-id'));
            window.showToast('Langue supprimée !');
            renderLangs();
          }
        });
      });
    }
  </script>
</body>
</html>
