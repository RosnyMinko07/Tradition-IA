<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Tradition IA</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
</head>
<body class="auth-body">
  <div class="bg-glow-container">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <div id="app">
    <header class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="images/tradiia_icon.png" alt="Tradition IA Logo" class="brand-logo-img" />
        <span>Tradition<span style="color: var(--primary);">IA</span></span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="translate.html" class="nav-link">Traduction</a>
        <a href="ai-assistant.html" class="nav-link">Assistant IA</a>
        <a href="dictionary.html" class="nav-link">Dictionnaire</a>
        <a href="history.html" class="nav-link">Historique</a>
      </nav>
      <div id="nav-user-container">
        <div class="nav-auth-buttons">
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Passer au Thème Blanc Transparent" aria-label="Passer au Thème Blanc Transparent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a href="login.html" class="btn btn-secondary" style="padding: 8px 16px;">Connexion</a>
          <a href="register.html" class="btn btn-primary" style="padding: 8px 16px;">S'inscrire</a>
        </div>
      </div>
    </header>

    <main class="main-content" style="max-width: 1180px; margin: 0 auto; width: 100%;">
      <div class="auth-container">
        <div class="auth-left">
          <div class="auth-left-content">
            <div class="auth-img-glow-wrapper">
              <img src="images/carte_gabon_nobg.png" alt="Carte du Gabon - Tradition IA" class="auth-gabon-img">
            </div>
            <h2 class="auth-left-title">Rejoignez l'Aventure</h2>
            <p class="auth-left-subtitle">Contribuez à la sauvegarde et à l'apprentissage des traditions linguistiques gabonaises.</p>
          </div>
        </div>

        <div class="auth-right">
          <div style="margin-bottom: 18px; display: flex; justify-content: center; align-items: center;">
            <img src="images/drapeau%20gabon.png" alt="Drapeau du Gabon" style="width: 76px; height: auto; max-height: 48px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 15px rgba(0, 230, 118, 0.3)); display: block;">
          </div>
          <h1 style="font-size: 1.95rem; margin-bottom: 4px; text-align: center;">Créer un Compte</h1>
          <p style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 22px; text-align: center;">Rejoignez la communauté Tradition IA</p>

          <form id="form-register" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
            <div class="form-group">
              <label class="form-label" style="font-size: 0.88rem; margin-bottom: 4px;">Nom Complet</label>
              <input type="text" id="reg-name" class="form-input" placeholder="ex: Jean-Marc Nzeng" required style="padding: 12px 16px; font-size: 0.96rem; border-radius: 12px;">
            </div>

            <div class="form-group">
              <label class="form-label" style="font-size: 0.88rem; margin-bottom: 4px;">Adresse Email</label>
              <input type="email" id="reg-email" class="form-input" placeholder="ex: jm.nzeng@mail.ga" required style="padding: 12px 16px; font-size: 0.96rem; border-radius: 12px;">
            </div>

            <div class="form-group">
              <label class="form-label" style="font-size: 0.88rem; margin-bottom: 4px;">Mot de passe</label>
              <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" style="padding: 12px 16px; font-size: 0.96rem; border-radius: 12px;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; margin-top: 6px; border-radius: 12px;">
              S'inscrire Maintenant ➔
            </button>
          </form>

          <div style="margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.88rem; color: var(--text-muted); text-align: center;">
            Déjà un compte ? <a href="login.html" style="color: var(--primary); font-weight: 600;">Se connecter</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('form-register')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-password').value;
        const user = window.Store.login(email, pass, 'user');
        window.Store.updateProfile({ name });
        window.showToast(`Compte créé avec succès ! Bienvenue ${name}.`);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
      });
    });
  </script>
</body>
</html>
