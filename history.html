<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique - Tradition IA</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/masks.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdf_knowledge.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div class="bg-glow-container">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <div id="app">
    <header class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="images/tradiia_icon.png" alt="Tradition IA Logo" class="brand-logo-img" />
        <span>Tradition<span style="color: var(--primary);">IA</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="translate.html" class="nav-link">Traduction</a>
        <a href="ai-assistant.html" class="nav-link">Assistant IA</a>
        <a href="dictionary.html" class="nav-link">Dictionnaire</a>
        <a href="history.html" class="nav-link active">Historique</a>
        <a href="profile.html" class="nav-link">Mon Profil</a>
      </nav>

      <div id="nav-user-container">
        <div class="nav-auth-buttons">
          <button class="btn-theme-toggle" id="btn-theme-toggle" title="Passer au Thème Blanc Transparent" aria-label="Passer au Thème Blanc Transparent">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a href="login.html" class="btn btn-secondary" style="padding: 8px 16px;">Connexion</a>
          <a href="register.html" class="btn btn-primary" style="padding: 8px 16px;">S'inscrire</a>
        </div>
      </div>
    </header>

    <div class="layout-container">
      <main class="main-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Historique des Traductions</h1>
            <p class="page-subtitle">Consultez et réutilisez l'ensemble de vos traductions passées</p>
          </div>
          <button id="btn-export-csv" class="btn btn-secondary">📥 Exporter en CSV</button>
        </div>

        <div class="data-table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Texte Original</th>
                <th>Traduction Générée</th>
                <th>Sens de Traduction</th>
                <th>Moteur</th>
              </tr>
            </thead>
            <tbody id="history-table-body">
              <!-- Chargé par JS -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.Store) {
        await window.Store.loadInitialData();
        const container = document.getElementById('history-table-body');
        if (container) {
          container.innerHTML = window.Store.translations.map(t => `
            <tr>
              <td style="color: var(--text-muted); font-size: 0.85rem;">${t.createdAt || 'Récent'}</td>
              <td style="font-weight: 600; color: var(--text-main);">${t.sourceText}</td>
              <td style="font-weight: 700; color: var(--primary);">${t.translatedText}</td>
              <td><span class="badge badge-blue-pro">${t.sourceLang || 'Français'} ➔ ${t.targetLang}</span></td>
              <td><span class="badge ${t.isAI ? 'badge-gold' : 'badge-blue'}">${t.isAI ? 'Modèle IA' : 'Dictionnaire'}</span></td>
            </tr>
          `).join('');
        }

        document.getElementById('btn-export-csv')?.addEventListener('click', () => {
          const translations = window.Store.translations;
          if (!translations.length) {
            window.showToast('Aucune donnée à exporter.', 'info');
            return;
          }
          const csv = ['Date;Texte Source;Traduction;Langue Cible'];
          translations.forEach(t => csv.push(`"${t.createdAt}";"${t.sourceText}";"${t.translatedText}";"${t.targetLang}"`));
          const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `tradition_ia_historique.csv`;
          a.click();
          window.showToast('Export CSV effectué !');
        });
      }
    });
  </script>
</body>
</html>
